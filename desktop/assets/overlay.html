<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data: file:; media-src 'self' file: glint-media:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --vl: #9d8ad1; --ink: #e7e7ea; --dim: #a1a1aa; --surface: rgba(21, 21, 23, .95); --border: #35353d; --ease: cubic-bezier(.2, .8, .2, 1); }
  * { box-sizing: border-box; margin: 0; border-radius: 0 !important; }
  html, body { background: transparent; overflow: hidden; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; color: var(--ink); user-select: none; }
  .toast { position: absolute; inset: 8px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 0; background: var(--surface);
    border: 1px solid var(--border); box-shadow: 0 14px 40px rgba(0,0,0,.5); opacity: 0; transform: translateX(-24px); overflow: hidden;
    transition: opacity .2s var(--ease), transform .26s var(--ease); }
  .toast.right { transform: translateX(24px); }
  .toast.on { opacity: 1; transform: none; }
  .bar { align-self: stretch; width: 4px; background: var(--vl); flex: none; transition: background .2s; }
  .toast.error .bar, .toast.error .dot { background: #c26a6a; }
  .toast.info .bar, .toast.info .dot, .toast.idle .bar, .toast.idle .dot { background: #6b6b74; }
  .toast.idle .ico { color: #a1a1aa; }
  .toast.idle.on .ico { animation: nope .34s cubic-bezier(.2,.8,.2,1); }
  @keyframes nope { 20% { transform: translateX(-4px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
  .s.h { margin-top: 3px; font-size: 11.5px; color: #c9c9cf; white-space: normal; line-height: 1.25; }
  .s.h:not([hidden]) { animation: swap .22s .12s cubic-bezier(.2,.8,.2,1) both; }
  .ico { position: relative; width: 52px; height: 52px; flex: none; display: grid; place-items: center; background: #1a1a1d; border: 1px solid #292930; color: var(--vl); overflow: hidden; }
  .ico img { width: 100%; height: 100%; object-fit: cover; }
  .ico svg { width: 26px; height: 26px; }
  .toast.on .ico { animation: pop .34s var(--ease); }
  .txt { min-width: 0; flex: 1; }
  .t { font-size: 15px; font-weight: 700; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
  .t .dot { width: 7px; height: 7px; background: var(--vl); flex: none; }
  .toast.captured .t .dot { animation: blink .5s steps(1) infinite; }
  #title { display: inline-block; }
  #title.swap { animation: swap .22s var(--ease); }
  .s { margin-top: 4px; font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s b { color: var(--ink); font-weight: 600; }
  .sweep { position: absolute; top: 0; bottom: 0; width: 70px; left: -90px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); pointer-events: none; }
  .toast.on .sweep { animation: sweep .8s .06s var(--ease) forwards; }
  .flash { position: absolute; inset: 0; background: var(--vl); opacity: 0; pointer-events: none; }
  .toast.flashing .flash { animation: flash .38s var(--ease); }
  .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--vl); transform-origin: left; transform: scaleX(0); opacity: .8; }
  .toast.captured .prog { animation: fill 1.2s var(--ease) forwards; }
  .toast.saved .prog { transform: scaleX(1); opacity: 0; transition: opacity .4s .2s; }
  @keyframes sweep { to { left: 110%; } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.08); } 100% { transform: none; } }
  @keyframes swap { from { opacity: 0; transform: translateY(5px); } }
  @keyframes flash { 0% { opacity: .22; } 100% { opacity: 0; } }
  @keyframes fill { to { transform: scaleX(.92); } }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0s !important; } }
</style>
</head>
<body>
<div class="toast" id="toast">
  <div class="bar"></div>
  <div class="ico" id="ico"></div>
  <div class="txt"><div class="t"><span class="dot"></span><span id="title"></span></div><div class="s" id="sub"></div><div class="s h" id="hint" hidden></div></div>
  <div class="sweep"></div><div class="flash"></div><div class="prog"></div>
</div>
<script>
  const sv = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICONS = {
    captured: sv('<circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/>'),
    saved: sv('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'),
    error: sv('<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'),
    idle: sv('<path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="m2 2 20 20"/>'),
    info: sv('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'),
    game: sv('<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>'),
  };
  const el = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let snd = null, nope = null;
  const load = (src, vol) => { if (!src) return null; const a = new Audio(src); a.preload = 'auto'; a.volume = Math.max(0, Math.min(1, Number(vol ?? .7))); a.load(); return a; };
  window.glintOverlay.onSound(cfg => {
    snd = load(cfg && cfg.src, cfg && cfg.volume);
    nope = load(cfg && cfg.nope, cfg && cfg.volume != null ? cfg.volume * 0.8 : .5);
  });
  function play(which) {
    const base = which === 'nope' ? nope : snd;
    if (!base) return;
    try { const a = base.paused || base.currentTime === 0 ? base : base.cloneNode(); a.volume = base.volume; a.currentTime = 0; a.play().catch(() => {}); } catch {}
  }
  let hideT = null, goneT = null, curId = null;
  function setIcon(kind, icon) {
    const ico = el('ico');
    ico.innerHTML = '';
    if (icon && /^(https:|data:image\/)/.test(icon)) {
      const img = new Image(); img.src = icon; img.onerror = () => { ico.innerHTML = ICONS[kind] || ICONS.saved; }; ico.appendChild(img);
    } else ico.innerHTML = ICONS[kind] || ICONS.saved;
  }
  window.glintOverlay.onToast(t => {
    if (t.accent) document.documentElement.style.setProperty('--vl', t.accent);
    if (t.sound) play(t.sound === 'nope' ? 'nope' : 'clip');
    if (!t.show) return;
    const box = el('toast');
    const update = t.id && t.id === curId && box.classList.contains('on');
    const kindChanged = box.dataset.kind !== (t.kind || 'saved');
    curId = t.id || null; box.dataset.kind = t.kind || 'saved';
    box.className = `toast ${t.kind || 'saved'} ${String(t.corner || '').endsWith('right') ? 'right' : ''} ${update ? 'on' : ''}`;
    const title = el('title');
    title.textContent = t.title || 'Clip saved';
    if (update) { title.classList.remove('swap'); void title.offsetWidth; title.classList.add('swap'); if (t.kind === 'saved') { box.classList.add('flashing'); } }
    el('sub').innerHTML = t.detail ? esc(t.detail) : `<b>${esc(t.game || 'Desktop')}</b>${t.length ? ` &middot; ${esc(t.length)}` : ''}`;
    el('hint').textContent = t.hint || ''; el('hint').hidden = !t.hint;
    if (!update || kindChanged || t.kind === 'error') setIcon(t.icon && t.kind !== 'error' ? t.kind : t.kind, t.kind === 'error' ? '' : t.icon);
    if (!update) { void box.offsetWidth; box.classList.add('on'); }
    clearTimeout(hideT); clearTimeout(goneT);
    const ms = t.kind === 'captured' ? 6000 : t.kind === 'error' ? 4500 : t.kind === 'idle' ? (t.hint ? 5200 : 2600) : t.kind === 'game' ? 3600 : 3000;
    hideT = setTimeout(() => { box.classList.remove('on'); goneT = setTimeout(() => window.glintOverlay.hidden(), 300); }, ms);
  });
</script>
</body>
</html>
